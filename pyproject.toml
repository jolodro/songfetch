[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "songfetch"
version = "1.0.0"
description = "Baixa músicas a partir de CSV do Exportify, planilhas, listas de texto ou links (Spotify/YouTube)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["yt-dlp", "mutagen"]

[project.optional-dependencies]
xlsx = ["openpyxl"]

[project.scripts]
songfetch = "songfetch.cli:main"

[tool.setuptools]
packages = ["songfetch"]
